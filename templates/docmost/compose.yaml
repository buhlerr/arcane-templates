x-arcane:
  icon: https://avatars.githubusercontent.com/u/172325533
  icon-light: https://avatars.githubusercontent.com/u/172325533
  icon-dark: https://avatars.githubusercontent.com/u/172325533
  urls:
    - https://github.com/lissy93/portainer-templates
  tags:
    - name: documentation
      color: gray
    - name: productivity
      color: blue

services:
  docmost:
    image: docmost/docmost:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - APP_URL=${APP_URL:-http://localhost:3000}
      # APP_SECRET must be at least 32 chars — generate with: openssl rand -hex 32
      - APP_SECRET=${APP_SECRET}
      - DATABASE_URL=postgresql://docmost:docmost@postgres:5432/docmost?sslmode=disable
      - REDIS_URL=redis://redis:6379
    volumes:
      - docmost-data:/app/data/storage
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=docmost
      - POSTGRES_USER=docmost
      - POSTGRES_PASSWORD=docmost
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data

volumes:
  docmost-data:
  postgres-data:
  redis-data:
