x-arcane:
  icon: https://raw.githubusercontent.com/ory/meta/master/static/banners/oathkeeper.svg
  icon-light: https://raw.githubusercontent.com/ory/meta/master/static/banners/oathkeeper.svg
  icon-dark: https://raw.githubusercontent.com/ory/meta/master/static/banners/oathkeeper.svg
  urls:
    - https://github.com/xneo1/portainer_templates
  tags:
    - name: identity-management
      color: yellow
    - name: security
      color: orange

services:
  kratos:
    environment:
      - SERVE_PUBLIC_BASE_URL=http://127.0.0.1:4455/.ory/kratos/public/

  kratos-selfservice-ui-node:
    environment:
      - PORT=4435
      - KRATOS_BROWSER_URL=http://127.0.0.1:4455/.ory/kratos/public
      - JWKS_URL=http://oathkeeper:4456/.well-known/jwks.json
      - SECURITY_MODE=jwks

  oathkeeper:
    image: oryd/oathkeeper:v0.40
    depends_on:
      - kratos
    ports:
      - 4455:4455
      - 4456:4456
    command:
      serve proxy -c "/etc/config/oathkeeper/oathkeeper.yml"
    environment:
      - LOG_LEVEL=debug
    restart: on-failure
    networks:
      - intranet
    volumes:
      - /portainer/Files/AppData/Config/oathkeeper:/etc/config/oathkeeper
