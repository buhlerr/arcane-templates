x-arcane:
  icon: https://raw.githubusercontent.com/go-shiori/shiori/master/docs/readme/cover.png
  icon-light: https://raw.githubusercontent.com/go-shiori/shiori/master/docs/readme/cover.png
  icon-dark: https://raw.githubusercontent.com/go-shiori/shiori/master/docs/readme/cover.png
  urls:
    - https://github.com/xneo1/portainer_templates
  tags:
    - name: tools
      color: blue

services:
  shiori:
    image: ghcr.io/go-shiori/shiori
    container_name: shiori-default
    environment:
      - TZ=Europe/Athens
      - PUID=1000
      - PGID=1000
    ports:
      - 8580:8080
    restart: unless-stopped
    volumes:
      - /portainer/Files/AppData/Config/shiori:/data
