x-arcane:
  icon: https://linkstack.org/wp-content/uploads/2023/04/logo-animated.svg
  icon-light: https://linkstack.org/wp-content/uploads/2023/04/logo-animated.svg
  icon-dark: https://linkstack.org/wp-content/uploads/2023/04/logo-animated.svg
  urls:
    - https://github.com/xneo1/portainer_templates
  tags:
    - name: social
      color: gray

services:

  linkstack:
    hostname: linkstack
    image: linkstackorg/linkstack:latest
    environment:
      TZ: Europe/Athens
      SERVER_ADMIN: admin@example.com
      HTTP_SERVER_NAME: example.com
      HTTPS_SERVER_NAME: example.com
      LOG_LEVEL: info
      PHP_MEMORY_LIMIT: 256M
      UPLOAD_MAX_FILESIZE: 8M
    volumes:
      - linkstack_data:/htdocs
    ports:
      - 8188:80
      - 8190:443
    restart: unless-stopped
volumes:
  linkstack_data:
    driver: local
    driver_opts:
      type: none
      device: "/mnt/extra/portainer/Files/AppData/Config/linkstack"
      o: bind
