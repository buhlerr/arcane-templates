x-arcane:
  icon: https://avatars.githubusercontent.com/u/17838164
  icon-light: https://avatars.githubusercontent.com/u/17838164
  icon-dark: https://avatars.githubusercontent.com/u/17838164
  urls:
    - https://github.com/lissy93/portainer-templates
  tags:
    - name: email
      color: pink
    - name: marketing
      color: gray

services:
  listmonk:
    image: listmonk/listmonk:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
    command:
      [sh, -c, "./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config '' && ./listmonk --config ''"]
    environment:
      - LISTMONK_app__address=0.0.0.0:9000
      # Super-admin seeded on first install (leave password blank to use the first-run setup screen)
      - LISTMONK_ADMIN_USER=${LISTMONK_ADMIN_USER:-admin}
      - LISTMONK_ADMIN_PASSWORD=${LISTMONK_ADMIN_PASSWORD:-}
      - LISTMONK_db__host=postgres
      - LISTMONK_db__port=5432
      - LISTMONK_db__user=listmonk
      - LISTMONK_db__password=listmonk
      - LISTMONK_db__database=listmonk
      - LISTMONK_db__ssl_mode=disable
      - TZ=Etc/UTC
    volumes:
      - listmonk-uploads:/listmonk/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=listmonk
      - POSTGRES_USER=listmonk
      - POSTGRES_PASSWORD=listmonk
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  listmonk-uploads:
  postgres-data:
