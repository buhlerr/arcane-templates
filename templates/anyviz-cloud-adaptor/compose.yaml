x-arcane:
  icon: https://portainer-io-assets.sfo2.cdn.digitaloceanspaces.com/logos/anyviz.png
  icon-light: https://portainer-io-assets.sfo2.cdn.digitaloceanspaces.com/logos/anyviz.png
  icon-dark: https://portainer-io-assets.sfo2.cdn.digitaloceanspaces.com/logos/anyviz.png
  urls:
    - https://github.com/portainer/templates
  tags:
    - name: edge
      color: gray

version: "2"
services:
  cloudadapter:
    image: anyviz/cloudadapter
    restart: always
    ports:
      - "8888:8888"
    volumes:
      - anyviz_config:/etc/anyviz
    network_mode: "host"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
volumes:
  anyviz_config:
