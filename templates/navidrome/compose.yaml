x-arcane:
  icon: https://github.com/navidrome/navidrome/raw/master/resources/logo-192x192.png
  icon-light: https://github.com/navidrome/navidrome/raw/master/resources/logo-192x192.png
  icon-dark: https://github.com/navidrome/navidrome/raw/master/resources/logo-192x192.png
  urls:
    - https://github.com/xneo1/portainer_templates
  tags:
    - name: multimedia
      color: red
    - name: music
      color: red

services:
  navidrome:
    container_name: navidrome
    image: deluan/navidrome:latest
    ports:
      - "4533:4533"
    environment:
      # Optional: put your config options customization here. Examples:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info  
      ND_BASEURL: ""
    volumes:
      - "/portainer/Files/AppData/Config/navidrome:/data"
      - "/path/to/your/music/folder:/music:ro"
