x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/factorio-server.svg
  icon-light: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/factorio-server.svg
  icon-dark: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/factorio-server.svg
  urls:
    - https://github.com/deployable-sh/stacks
  tags:
    - name: game-servers
      color: gray

name: factorio

services:
  factorio:
    image: factoriotools/factorio:stable
    restart: unless-stopped
    environment:
      LOAD_LATEST_SAVE: "true"
      GENERATE_NEW_SAVE: "true"
      SAVE_NAME: ${SAVE_NAME:-miget}
      UPDATE_MODS_ON_START: ${UPDATE_MODS_ON_START:-false}
    ports:
      - "34197:34197/udp"
    volumes:
      - factoriodata:/factorio

volumes:
  factoriodata:
