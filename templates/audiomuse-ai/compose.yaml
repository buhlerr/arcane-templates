x-arcane:
  icon: https://raw.githubusercontent.com/NeptuneHub/AudioMuse-AI/main/native-build/linux/packaging/icons/audiomuse-ai_128.png
  icon-light: https://raw.githubusercontent.com/NeptuneHub/AudioMuse-AI/main/native-build/linux/packaging/icons/audiomuse-ai_128.png
  icon-dark: https://raw.githubusercontent.com/NeptuneHub/AudioMuse-AI/main/native-build/linux/packaging/icons/audiomuse-ai_128.png
  urls:
    - https://github.com/lissy93/portainer-templates
  tags:
    - name: music
      color: red
    - name: media
      color: red
    - name: ai
      color: pink

# AudioMuse-AI - sonic analysis + automatic playlist generation for self-hosted music servers
# Mirrors https://github.com/NeptuneHub/AudioMuse-AI/blob/main/deployment/docker-compose.yaml
# The flask + worker containers share one image; SERVICE_TYPE decides which role each runs.
# Music servers are connected from the browser Setup Wizard on first run, not via env vars.

services:
  audiomuse-ai-flask:
    image: ghcr.io/neptunehub/audiomuse-ai:${AUDIOMUSE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8000}:8000"
    environment:
      SERVICE_TYPE: flask
      TZ: ${TZ:-UTC}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-audiomuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audiomusepassword}
      POSTGRES_DB: audiomusedb
      REDIS_URL: redis://redis:6379/0
      TEMP_DIR: /app/temp_audio
    volumes:
      - temp-audio-flask:/app/temp_audio
      # Plugins are installed to disk (code + pip deps), so each container keeps its own copy
      - plugins-flask:/app/plugin/installed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  audiomuse-ai-worker:
    image: ghcr.io/neptunehub/audiomuse-ai:${AUDIOMUSE_TAG:-latest}
    restart: unless-stopped
    environment:
      SERVICE_TYPE: worker
      TZ: ${TZ:-UTC}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-audiomuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audiomusepassword}
      POSTGRES_DB: audiomusedb
      REDIS_URL: redis://redis:6379/0
      TEMP_DIR: /app/temp_audio
    volumes:
      - temp-audio-worker:/app/temp_audio
      - plugins-worker:/app/plugin/installed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # AudioMuse-AI is built against PostgreSQL 15 - other majors are known to error
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_USER: ${POSTGRES_USER:-audiomuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audiomusepassword}
      POSTGRES_DB: audiomusedb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-audiomuse} -d audiomusedb"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Task queue for the analysis/clustering jobs
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres-data:
  redis-data:
  temp-audio-flask:
  temp-audio-worker:
  plugins-flask:
  plugins-worker:
