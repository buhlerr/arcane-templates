x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/memos.png
  icon-light: https://cdn.jsdelivr.net/gh/selfhst/icons/png/memos.png
  icon-dark: https://cdn.jsdelivr.net/gh/selfhst/icons/png/memos.png
  urls:
    - https://github.com/deployable-sh/stacks
  tags:
    - name: productivity-pm
      color: blue

name: memos

services:
  memos:
    image: neosmemo/memos:0.29.1
    restart: unless-stopped
    environment:
      MEMOS_PORT: "5000"
      MEMOS_MODE: prod
    ports:
      - "5000:5000"
    volumes:
      - memosdata:/var/opt/memos

volumes:
  memosdata:
