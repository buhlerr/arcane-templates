x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/jenkins.png
  icon-light: https://cdn.jsdelivr.net/gh/selfhst/icons/png/jenkins.png
  icon-dark: https://cdn.jsdelivr.net/gh/selfhst/icons/png/jenkins.png
  urls:
    - https://github.com/deployable-sh/stacks
  tags:
    - name: dev-tools
      color: blue

name: jenkins

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    restart: unless-stopped
    environment:
      JENKINS_OPTS: --httpPort=5000
      JAVA_OPTS: -Xmx1536m
    ports:
      - "5000:5000"
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:
