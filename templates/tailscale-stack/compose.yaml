x-arcane:
  icon: https://raw.githubusercontent.com/xneo1/portainer_templates/master/Images/tailscale.jpg
  icon-light: https://raw.githubusercontent.com/xneo1/portainer_templates/master/Images/tailscale.jpg
  icon-dark: https://raw.githubusercontent.com/xneo1/portainer_templates/master/Images/tailscale.jpg
  urls:
    - https://github.com/xneo1/portainer_templates
  tags:
    - name: network
      color: gray
    - name: vpn
      color: orange

services:
  tailscale:
      hostname: tailscale                                          # This will become the tailscale device name
      container_name: tailscale
      image: tailscale/tailscale:latest
      network_mode: host
      volumes:
          - /portainer/Files/AppData/Config/tailscale:/var/lib        # State data will be stored in this directory
          - /dev/net/tun:/dev/net/tun                      # Required for tailscale to work
      cap_add:                                             # Required for tailscale to work
        - net_admin
        - sys_module
      command: tailscaled
      restart: unless-stopped
