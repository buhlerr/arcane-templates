x-arcane:
  icon: https://avatars.githubusercontent.com/u/5375661?s=200&v=4
  icon-light: https://avatars.githubusercontent.com/u/5375661?s=200&v=4
  icon-dark: https://avatars.githubusercontent.com/u/5375661?s=200&v=4
  urls:
    - https://github.com/portainer/templates
  tags:
    - name: edge
      color: gray

version: "3.7"

services:
  node-red:
    image: nodered/node-red:latest
    environment:
      - TZ=${TZ}
    ports:
      - "1880:1880"
    networks:
      - node-red-net
    volumes:
      - node-red-data:/data

volumes:
  node-red-data:

networks:
  node-red-net:
