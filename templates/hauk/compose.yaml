x-arcane:
  icon: https://github.com/bilde2910/Hauk/raw/master/frontend/assets/logo.svg
  icon-light: https://github.com/bilde2910/Hauk/raw/master/frontend/assets/logo.svg
  icon-dark: https://github.com/bilde2910/Hauk/raw/master/frontend/assets/logo.svg
  urls:
    - https://github.com/xneo1/portainer_templates
  tags:
    - name: tracking
      color: gray

services:
  hauk:
    image: bilde2910/hauk:latest
    container_name: Hauk
    hostname: hauk
    healthcheck:
      test: curl -f http://localhost:80/ || exit 1
    ports:
      - 7735:80
    volumes:
      - /portainer/Files/AppData/Config/hauk:/etc/hauk:rw
    restart: on-failure
