x-arcane:
  icon: https://raw.githubusercontent.com/Stirling-Tools/Stirling-PDF/main/docs/stirling.png
  icon-light: https://raw.githubusercontent.com/Stirling-Tools/Stirling-PDF/main/docs/stirling.png
  icon-dark: https://raw.githubusercontent.com/Stirling-Tools/Stirling-PDF/main/docs/stirling.png
  urls:
    - https://github.com/xneo1/portainer_templates
  tags:
    - name: pdf-tools
      color: blue
    - name: productivity
      color: blue

services:
  stirling-pdf:
    image: frooodle/s-pdf:latest
    ports:
      - 8180:8080
    volumes:
      - /portainer/Files/AppData/Config/tesseract-training-data:/usr/share/tesseract-ocr/4.00/tessdata #Required for extra OCR languages
      - /portainer/Files/AppData/Config/stirling-pdf:/configs
    #  - /location/of/customFiles:/customFiles/
    environment:
      - DOCKER_ENABLE_SECURITY=false
