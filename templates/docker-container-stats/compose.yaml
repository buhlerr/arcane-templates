x-arcane:
  icon: https://raw.githubusercontent.com/Poeschl/Hassio-Addons/master/container-stats/logo.png
  icon-light: https://raw.githubusercontent.com/Poeschl/Hassio-Addons/master/container-stats/logo.png
  icon-dark: https://raw.githubusercontent.com/Poeschl/Hassio-Addons/master/container-stats/logo.png
  urls:
    - https://github.com/xneo1/portainer_templates
  tags:
    - name: docker
      color: gray

services:
  stats:
    image: virtualzone/docker-container-stats
    container_name: docker-stats
    ports:
      - 8383:8080
    environment:
      STATS_UPDATE_INTERVAL: 10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /portainer/Files/AppData/Config/docker-stats/db:/opt/docker-stats/db
