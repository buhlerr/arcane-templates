x-arcane:
  icon: https://portainer-io-assets.sfo2.digitaloceanspaces.com/logos/wordpress.png
  icon-light: https://portainer-io-assets.sfo2.digitaloceanspaces.com/logos/wordpress.png
  icon-dark: https://portainer-io-assets.sfo2.digitaloceanspaces.com/logos/wordpress.png
  urls:
    - https://github.com/portainer/templates
  tags:
    - name: cms
      color: blue

version: '3'

services:
   db:
     image: mysql:5.7
     volumes:
       - db_data:/var/lib/mysql
     restart: always
     environment:
       MYSQL_ROOT_PASSWORD: ${MYSQL_DATABASE_PASSWORD}
       MYSQL_DATABASE: wordpress
       MYSQL_USER: wordpress
       MYSQL_PASSWORD: wordpress

   wordpress:
     image: wordpress:latest
     ports:
       - 80
     restart: always
     environment:
       WORDPRESS_DB_HOST: db:3306
       WORDPRESS_DB_USER: wordpress
       WORDPRESS_DB_PASSWORD: wordpress

volumes:
    db_data:
