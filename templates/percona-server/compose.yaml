x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/percona-server.svg
  icon-light: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/percona-server.svg
  icon-dark: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/percona-server.svg
  urls:
    - https://github.com/deployable-sh/stacks
  tags:
    - name: database
      color: purple

name: percona-server

services:
  percona:
    image: percona/percona-server:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - perconadata:/var/lib/mysql

volumes:
  perconadata:
