x-arcane:
  icon: https://hotio.dev/img/image-logos/flood.svg
  icon-light: https://hotio.dev/img/image-logos/flood.svg
  icon-dark: https://hotio.dev/img/image-logos/flood.svg
  urls:
    - https://github.com/xneo1/portainer_templates
  tags:
    - name: downloaders
      color: gray

services:
  qflood:
    container_name: qflood
    image: hotio/qflood
    restart: always
    ports:
      - "8282:8080"
      - "3223:3000"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Europe/Athens
      - FLOOD_AUTH=false
    volumes:
      - /portainer/Files/AppData/Config/flood:/config
