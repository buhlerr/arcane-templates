x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/typesense.png
  icon-light: https://cdn.jsdelivr.net/gh/selfhst/icons/png/typesense.png
  icon-dark: https://cdn.jsdelivr.net/gh/selfhst/icons/png/typesense.png
  urls:
    - https://github.com/deployable-sh/stacks
  tags:
    - name: search-vectors
      color: gray

name: typesense

services:
  typesense:
    image: typesense/typesense:30.2
    restart: unless-stopped
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_PORT: "5000"
      TYPESENSE_ENABLE_CORS: "true"
    ports:
      - "5000:5000"
    volumes:
      - typesensedata:/data

volumes:
  typesensedata:
