x-arcane:
  icon: https://vikunja.io/images/vikunja.png
  icon-light: https://vikunja.io/images/vikunja.png
  icon-dark: https://vikunja.io/images/vikunja.png
  urls:
    - https://github.com/xneo1/portainer_templates
  tags:
    - name: tools
      color: blue
    - name: productivity
      color: blue

services:
  vikunjadb:
    image: mariadb:10
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: supersecret
      MYSQL_USER: vikunja
      MYSQL_PASSWORD: secret
      MYSQL_DATABASE: vikunja
    volumes:
      - ./db:/var/lib/mysql
    restart: unless-stopped
  api:
    image: vikunja/api
    environment:
      VIKUNJA_DATABASE_HOST: vikunjadb
      VIKUNJA_DATABASE_PASSWORD: secret
      VIKUNJA_DATABASE_TYPE: mysql
      VIKUNJA_DATABASE_USER: vikunja
      VIKUNJA_DATABASE_DATABASE: vikunja
      VIKUNJA_SERVICE_JWTSECRET: lgdfjgdlamsvcnls
      VIKUNJA_SERVICE_FRONTENDURL: http://10.11.11.128:1180/api/v1/
    ports:
      - 3456:3456
    volumes:
      - ./files:/app/vikunja/files
    depends_on:
      - vikunjadb
    restart: unless-stopped
  frontend:
    image: vikunja/frontend
    ports:
      - 1180:80
    environment:
      VIKUNJA_API_URL: http://10.11.11.128:3456/api/v1
    restart: unless-stopped
