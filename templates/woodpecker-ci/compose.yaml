x-arcane:
  icon: https://avatars.githubusercontent.com/u/84780935
  icon-light: https://avatars.githubusercontent.com/u/84780935
  icon-dark: https://avatars.githubusercontent.com/u/84780935
  urls:
    - https://github.com/lissy93/portainer-templates
  tags:
    - name: ci-cd
      color: gray
    - name: development
      color: blue

services:
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v3
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      WOODPECKER_OPEN: "true"
      # Public URL of this server — used for OAuth callbacks and webhooks
      WOODPECKER_HOST: ${WOODPECKER_HOST:-http://localhost:8000}
      # Shared secret between server and agent — must match below
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:-changeme-generate-a-long-random-secret}
      # Forge — Woodpecker will not start without one configured.
      # Defaults to GitHub; register an OAuth app and supply client + secret.
      # For Gitea/Forgejo/GitLab, swap these for the matching WOODPECKER_<FORGE>_* vars.
      WOODPECKER_GITHUB: "true"
      WOODPECKER_GITHUB_CLIENT: ${WOODPECKER_GITHUB_CLIENT}
      WOODPECKER_GITHUB_SECRET: ${WOODPECKER_GITHUB_SECRET}
    volumes:
      - woodpecker-data:/var/lib/woodpecker/

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3
    restart: unless-stopped
    command: agent
    environment:
      # gRPC connection to the server (port 9000, internal to the stack)
      WOODPECKER_SERVER: woodpecker-server:9000
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:-changeme-generate-a-long-random-secret}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - woodpecker-server

volumes:
  woodpecker-data:
