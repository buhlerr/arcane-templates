x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/changedetection.png
  icon-light: https://cdn.jsdelivr.net/gh/selfhst/icons/png/changedetection.png
  icon-dark: https://cdn.jsdelivr.net/gh/selfhst/icons/png/changedetection.png
  urls:
    - https://github.com/deployable-sh/stacks
  tags:
    - name: monitoring-analytics
      color: orange

name: changedetection

services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:0.55.7
    restart: unless-stopped
    environment:
      PORT: "5000"
      BASE_URL: ${BASE_URL:-http://localhost:5000}
    ports:
      - "5000:5000"
    volumes:
      - datastore:/datastore

volumes:
  datastore:
