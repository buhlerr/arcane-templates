x-arcane:
  icon: https://avatars.githubusercontent.com/u/20967956
  icon-light: https://avatars.githubusercontent.com/u/20967956
  icon-dark: https://avatars.githubusercontent.com/u/20967956
  urls:
    - https://github.com/lissy93/portainer-templates
  tags:
    - name: productivity
      color: blue
    - name: cloud
      color: yellow

# SPDX-FileCopyrightText: 2023 XWiki CryptPad Team <contact@cryptpad.org> and contributors
#
# SPDX-License-Identifier: AGPL-3.0-or-later

---
services:
  cryptpad:
    image: "cryptpad/cryptpad:version-2026.5.1"
    hostname: cryptpad
    restart: unless-stopped

    environment:
      # MAIN and SANDBOX must be two DIFFERENT origins (required for XSS sandboxing)
      - CPAD_MAIN_DOMAIN=${CPAD_MAIN_DOMAIN}
      - CPAD_SANDBOX_DOMAIN=${CPAD_SANDBOX_DOMAIN}
      - CPAD_CONF=/cryptpad/config/config.js

    volumes:
      - cryptpad-blob:/cryptpad/blob
      - cryptpad-block:/cryptpad/block
      - cryptpad-customize:/cryptpad/customize
      - cryptpad-data:/cryptpad/data
      - cryptpad-datastore:/cryptpad/datastore

    ports:
      - "3000:3000"
      - "3003:3003"

    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000

volumes:
  cryptpad-blob:
  cryptpad-block:
  cryptpad-customize:
  cryptpad-data:
  cryptpad-datastore:
