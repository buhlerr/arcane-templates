x-arcane:
  icon: https://raw.githubusercontent.com/KSJaay/Lunalytics/main/public/LogoWithName.png
  icon-light: https://raw.githubusercontent.com/KSJaay/Lunalytics/main/public/LogoWithName.png
  icon-dark: https://raw.githubusercontent.com/KSJaay/Lunalytics/main/public/LogoWithName.png
  urls:
    - https://github.com/xneo1/portainer_templates
  tags:
    - name: analytics
      color: gray

# docker-compose.yml
services:
  lunalytics:
    image: ksjaay/lunalytics:latest
    container_name: lunalytics
    ports:
      - '2308:2308'
    volumes:
      - /portainer/Files/AppData/Config/lunalytics/data:/app/data
      - /portainer/Files/AppData/Config/lunalytics/logs:/app/logs
