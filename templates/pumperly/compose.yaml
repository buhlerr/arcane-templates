x-arcane:
  icon: https://avatars.githubusercontent.com/u/9169332
  icon-light: https://avatars.githubusercontent.com/u/9169332
  icon-dark: https://avatars.githubusercontent.com/u/9169332
  urls:
    - https://github.com/lissy93/portainer-templates
  tags:
    - name: tools
      color: blue
    - name: networking
      color: orange

services:
  pumperly:
    image: drumsergio/pumperly:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://pumperly:pumperly@postgres:5432/pumperly
      - TZ=UTC
      - PUMPERLY_DEFAULT_COUNTRY=${PUMPERLY_DEFAULT_COUNTRY:-ES}
      - PUMPERLY_CLUSTER_STATIONS=true
      - PUMPERLY_EV_ENABLED=1
      # Optional external services — uncomment and point at your own instances:
      # - VALHALLA_URL=http://valhalla:8002   # enables route planning
      # - PHOTON_URL=http://photon:2322        # enables address autocomplete / geocoding
      # - PUMPERLY_OCM_API_KEY=                 # OpenChargeMap key for EV charging data
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 512M

  postgres:
    image: postgis/postgis:17-3.4
    restart: unless-stopped
    environment:
      - POSTGRES_DB=pumperly
      - POSTGRES_USER=pumperly
      - POSTGRES_PASSWORD=pumperly
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
