x-arcane:
  icon: https://avatars.githubusercontent.com/u/64215741
  icon-light: https://avatars.githubusercontent.com/u/64215741
  icon-dark: https://avatars.githubusercontent.com/u/64215741
  urls:
    - https://github.com/lissy93/portainer-templates
  tags:
    - name: productivity
      color: blue
    - name: project-management
      color: yellow

services:
  planka:
    image: ghcr.io/plankanban/planka:latest
    restart: unless-stopped
    ports:
      - "3000:1337"
    environment:
      # BASE_URL must EXACTLY match the address you open Planka at, or login breaks
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - DATABASE_URL=postgresql://postgres@postgres/planka
      - SECRET_KEY=${SECRET_KEY}
      # Seeds the first admin on a fresh instance (Planka v2 has no built-in demo login)
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-demo@demo.demo}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-changeme}
      - DEFAULT_ADMIN_NAME=${DEFAULT_ADMIN_NAME:-Admin User}
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME:-admin}
    volumes:
      - planka-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=planka
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planka"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  planka-data:
  postgres-data:
