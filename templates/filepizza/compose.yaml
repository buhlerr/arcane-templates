x-arcane:
  icon: https://raw.githubusercontent.com/kern/filepizza/master/src/static/images/wordmark.png
  icon-light: https://raw.githubusercontent.com/kern/filepizza/master/src/static/images/wordmark.png
  icon-dark: https://raw.githubusercontent.com/kern/filepizza/master/src/static/images/wordmark.png
  urls:
    - https://github.com/xneo1/portainer_templates
  tags:
    - name: downloaders
      color: gray

services:
  filepizza:
    image: kern/filepizza:latest
    restart: always
    build:
      context: .
    ports:
      - 3333:3333
    environment:
      - PORT=3333
      - EXTRA_ICE_SERVERS=turn:localhost:3478
      - WEBTORRENT_TRACKERS=ws://localhost:28000
  coturn:
    image: instrumentisto/coturn:latest
    network_mode: host
    ports:
      - 3478:3478
  bittorrent-tracker:
    image: henkel/bittorrent-tracker:latest
    command: ["npx", "bittorrent-tracker", "--http-hostname", "0.0.0.0", "--ws"]
    ports:
    - 28000:8000
