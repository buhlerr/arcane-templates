x-arcane:
  icon: https://user-images.githubusercontent.com/20560781/80213166-0e560e00-8639-11ea-944e-4f79fdbcef55.png
  icon-light: https://user-images.githubusercontent.com/20560781/80213166-0e560e00-8639-11ea-944e-4f79fdbcef55.png
  icon-dark: https://user-images.githubusercontent.com/20560781/80213166-0e560e00-8639-11ea-944e-4f79fdbcef55.png
  urls:
    - https://github.com/xneo1/portainer_templates
  tags:
    - name: tools
      color: blue

services:
    #FPM image
    koillection:
        container_name: koillection
        image: koillection/koillection:dev
        restart: always
        ports:
            - 181:80
        environment:
            - APP_ENV=dev
            - APP_DEBUG=1
            - DB_DRIVER=pdo_pgsql
            - DB_NAME=koillection
            - DB_HOST=postgresql
            - DB_PORT=25432
            - DB_USER=postgres
            - DB_PASSWORD=password
            - DB_VERSION=14
            - PHP_TZ=Europe/Athens
            - HTTPS_ENABLED=0
        depends_on:
            - koinmysql
            - postgresql
        volumes:
            - /portainer/Files/AppData/Config/koillection/public/uploads:/var/www/koillection/public/uploads
            - /portainer/Files/AppData/Config/koillection:/var/www/koillection

    postgresql:
        container_name: postgresql
        image: postgres:14
        environment:
            - POSTGRES_DB=koillection
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=password
            - POSTGRES_HOST_AUTH_METHOD=trust
        ports:
            - 25432:5432
        volumes:
            - /portainer/Files/AppData/Config/postgresql:/var/lib/postgresql/data

    koinmysql:
        container_name: mysql
        image: mysql:latest
        command: --default-authentication-plugin=mysql_native_password
        environment:
            - MYSQL_ROOT_PASSWORD=password
            - MYSQL_DATABASE=koillection
        ports:
            - 43306:3306
        volumes:
            - /portainer/Files/AppData/Config/koillection/koinmysql:/var/lib/mysql
