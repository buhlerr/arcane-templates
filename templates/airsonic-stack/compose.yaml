x-arcane:
  icon: https://raw.githubusercontent.com/xneo1/portainer_templates/master/Images/airsonic-logo.png
  icon-light: https://raw.githubusercontent.com/xneo1/portainer_templates/master/Images/airsonic-logo.png
  icon-dark: https://raw.githubusercontent.com/xneo1/portainer_templates/master/Images/airsonic-logo.png
  urls:
    - https://github.com/xneo1/portainer_templates
  tags:
    - name: audio
      color: red
    - name: multimedia
      color: red

services:
  airsonic:
    image: lscr.io/linuxserver/airsonic
    container_name: airsonic
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Athens
    volumes:
      - /portainer/Files/AppData/Config/airsonic:/config
      - /portainer/multimedia/music/:/music
      - /portainer/multimedia/music/playlists:/playlists
      - /portainer/multimedia/podcasts:/podcasts
      - /portainer/multimedia/music/othermedia:/media #optional
    ports:
      - 4040:4040
    restart: unless-stopped
