x-arcane:
  icon: https://www.mailpile.is/img/icon-512x512.png
  icon-light: https://www.mailpile.is/img/icon-512x512.png
  icon-dark: https://www.mailpile.is/img/icon-512x512.png
  urls:
    - https://github.com/xneo1/portainer_templates
  tags:
    - name: email
      color: pink

services:
  mailpile:
    container_name: mailpile
    image: rroemhild/mailpile
    volumes:
      - /portainer/Files/AppData/Config/mailpile:/root/.local/share/Mailpile
      - /portainer/Files/AppData/Config/mailpile/gnu:/root/.gnupg
    ports:
      - '33411:33411'
