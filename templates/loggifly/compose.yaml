x-arcane:
  icon: https://github.com/clemcer/loggifly/raw/main/images/icon.png
  icon-light: https://github.com/clemcer/loggifly/raw/main/images/icon.png
  icon-dark: https://github.com/clemcer/loggifly/raw/main/images/icon.png
  urls:
    - https://github.com/xneo1/portainer_templates
  tags:
    - name: monitoring
      color: orange
    - name: logs
      color: gray

version: "3.8"
services:
  loggifly:
    image: ghcr.io/clemcer/loggifly:latest
    container_name: loggifly
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Comment out the following if you are only using environment variables. 
      # A config template will be downloaded in /config
      # edit and rename it to config.yaml or create a new file with your config in it
      - /portainer/Files/AppData/Config/loggifly/config.yaml:/config 
    environment:
      - TZ=Europe/Athens
    restart: unless-stopped
