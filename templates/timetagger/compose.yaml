x-arcane:
  icon: https://timetagger.app/timetagger_wl.svg
  icon-light: https://timetagger.app/timetagger_wl.svg
  icon-dark: https://timetagger.app/timetagger_wl.svg
  urls:
    - https://github.com/xneo1/portainer_templates
  tags:
    - name: productivity
      color: blue
    - name: time-related
      color: gray

services:
  timetagger:
    image: ghcr.io/almarklein/timetagger
    ports:
      - "280:80"
    volumes:
      - /portainer/Files/AppData/Config/timetagger:/root/_timetagger
    environment:
      - TIMETAGGER_BIND=0.0.0.0:80
      - TIMETAGGER_DATADIR=/root/_timetagger
      - TIMETAGGER_LOG_LEVEL=info
      - TIMETAGGER_CREDENTIALS=test:$$2a$$08$$0CD1NFiIbancwWsu3se1v.RNR/b7YeZd71yg3cZ/3whGlyU6Iny5i  # test:test
