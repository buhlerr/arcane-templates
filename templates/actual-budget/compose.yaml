x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/actual-budget.png
  icon-light: https://cdn.jsdelivr.net/gh/selfhst/icons/png/actual-budget.png
  icon-dark: https://cdn.jsdelivr.net/gh/selfhst/icons/png/actual-budget.png
  urls:
    - https://github.com/deployable-sh/stacks
  tags:
    - name: productivity-pm
      color: blue

name: actual

services:
  actual:
    image: ghcr.io/actualbudget/actual:26.6.0
    restart: unless-stopped
    environment:
      ACTUAL_PORT: "5000"
    ports:
      - "5000:5000"
    volumes:
      - actualdata:/data

volumes:
  actualdata:
