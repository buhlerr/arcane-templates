x-arcane:
  icon: https://homechart.app/images/homechart.min.776793e5e4334866f0799e8a84b8448efb1b06cb2762b2bb20f99068ac36136c.png
  icon-light: https://homechart.app/images/homechart.min.776793e5e4334866f0799e8a84b8448efb1b06cb2762b2bb20f99068ac36136c.png
  icon-dark: https://homechart.app/images/homechart.min.776793e5e4334866f0799e8a84b8448efb1b06cb2762b2bb20f99068ac36136c.png
  urls:
    - https://github.com/xneo1/portainer_templates
  tags:
    - name: tools
      color: blue

volumes:
  postgres: {}
  
services:
  homechart:
    container_name: homechart
    depends_on:
      - postgres
    environment:
      HOMECHART_POSTGRESQL_HOSTNAME: postgres
      HOMECHART_POSTGRESQL_PASSWORD: postgres
      HOMECHART_POSTGRESQL_USERNAME: postgres
    image: ghcr.io/candiddev/homechart:latest
    ports:
      - "3030:3000"
    restart: always
  postgres:
    environment:
      POSTGRES_PASSWORD: postgres
    image: postgres:14
    restart: always
    volumes:
      - /portainer/Files/AppData/Config/postgres:/var/lib/postgresql/data
