x-arcane:
  icon: https://user-images.githubusercontent.com/7554214/153162406-bf8fd16f-aa98-4604-b87b-e13ab4baf604.png
  icon-light: https://user-images.githubusercontent.com/7554214/153162406-bf8fd16f-aa98-4604-b87b-e13ab4baf604.png
  icon-dark: https://user-images.githubusercontent.com/7554214/153162406-bf8fd16f-aa98-4604-b87b-e13ab4baf604.png
  urls:
    - https://github.com/xneo1/portainer_templates
  tags:
    - name: cms
      color: blue

services:
  medusa-backend:
    build:
      dockerfile: Dockerfile.prod
    image: backend:latest
    container_name: medusa-server
    restart: always
    depends_on:
      - medusa-postgres
      - medusa-redis
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/medusa-docker
      NODE_ENV: production
      STORE_CORS: http://localhost
    volumes:
      - /portainer/Files/AppData/Config/medusacms/backend:/app/medusa
      - /portainer/Files/AppData/Config/medusacms/backend/node_modules:/app/medusa/node_modules  
    ports:
      - "9009:9000"

  medusa-postgres:
    image: postgres:13.9-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medusa-docker

  medusa-redis:
    redis:latest
    restart: always

  medusa-admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.prod
    admin:latest
    restart: always
    depends_on:
      - medusa-backend
    container_name: medusa-admin
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --openssl-legacy-provider
    ports:
      - "7007:80"

  medusa-storefront:
    build:
      dockerfile: Dockerfile.prod
    storefront:latest
    container_name: medusa-storefront
    restart: always
    environment:
      NODE_ENV: production
    volumes:
      - /portainer/Files/AppData/Config/medusacms/storefront:/app/storefront
      - /portainer/Files/AppData/Config/medusacms/storefront/node_modules:/app/storefront/node_modules  
    depends_on:
      - medusa-backend
    ports:
      - "808:80"
