x-arcane:
  icon: https://github.com/excalidraw/excalidraw/raw/master/public/og-image-sm.png
  icon-light: https://github.com/excalidraw/excalidraw/raw/master/public/og-image-sm.png
  icon-dark: https://github.com/excalidraw/excalidraw/raw/master/public/og-image-sm.png
  urls:
    - https://github.com/xneo1/portainer_templates
  tags:
    - name: productivity
      color: blue
    - name: drawing
      color: gray

services:
  excalidraw:
    build:
      context: .
      args:
        - NODE_ENV=development
    container_name: excalidraw
    ports:
      - "3111:80"
    restart: on-failure
    stdin_open: true
    healthcheck:
      disable: true
    environment:
      - NODE_ENV=development
    volumes:
      - /portainer/Files/AppData/Config/excalidraw/:/opt/node_app/app:delegated
      - /portainer/Files/AppData/Config/excalidraw/package.json:/opt/node_app/package.json
      - /portainer/Files/AppData/Config/excalidraw/yarn.lock:/opt/node_app/yarn.lock
      - /portainer/Files/AppData/Config/excalidraw/notused:/opt/node_app/app/node_modules
