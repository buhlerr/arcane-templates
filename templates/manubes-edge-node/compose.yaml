x-arcane:
  icon: https://portainer-io-assets.sfo2.digitaloceanspaces.com/logos/inray-manubes.png
  icon-light: https://portainer-io-assets.sfo2.digitaloceanspaces.com/logos/inray-manubes.png
  icon-dark: https://portainer-io-assets.sfo2.digitaloceanspaces.com/logos/inray-manubes.png
  urls:
    - https://github.com/portainer/templates
  tags:
    - name: edge
      color: gray

version: '3'

services:
  manubes-edge-node:
    image: inray/manubes-edge:preview
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - manubes-data:/data
    restart: always
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
    command: ${MANUBES_SECRET}

volumes:
  manubes-data:
