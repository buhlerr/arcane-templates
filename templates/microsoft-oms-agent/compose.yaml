x-arcane:
  icon: https://portainer-io-assets.sfo2.digitaloceanspaces.com/logos/microsoft.png
  icon-light: https://portainer-io-assets.sfo2.digitaloceanspaces.com/logos/microsoft.png
  icon-dark: https://portainer-io-assets.sfo2.digitaloceanspaces.com/logos/microsoft.png
  urls:
    - https://github.com/portainer/templates
  tags:
    - name: ops
      color: gray

version: '3'

services:
  oms:
    image: microsoft/oms
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WSID: ${AZURE_WORKSPACE_ID}
      KEY: ${AZURE_PRIMARY_KEY}
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
    ports:
      - "25225:25225"
      - "25224:25224/udp"
