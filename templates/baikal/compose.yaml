x-arcane:
  icon: https://sabre.io/img/logo.png
  icon-light: https://sabre.io/img/logo.png
  icon-dark: https://sabre.io/img/logo.png
  urls:
    - https://github.com/xneo1/portainer_templates
  tags:
    - name: calendar
      color: gray
    - name: productivity
      color: blue

services:
  baikal:
    image: ckulka/baikal:nginx
    restart: always
    ports:
      - "8220:80"
    volumes:
      - /portainer/Files/AppData/Config/baikal/config:/var/www/baikal/config
      - /portainer/Files/AppData/Config/baikal/data:/var/www/baikal/Specific

volumes:
  config:
  data:
