x-arcane:
  icon: https://raw.githubusercontent.com/xneo1/portainer_templates/master/Images/ombi.png
  icon-light: https://raw.githubusercontent.com/xneo1/portainer_templates/master/Images/ombi.png
  icon-dark: https://raw.githubusercontent.com/xneo1/portainer_templates/master/Images/ombi.png
  urls:
    - https://github.com/xneo1/portainer_templates
  tags:
    - name: downloaders
      color: gray
    - name: video
      color: red
    - name: tools
      color: blue

services:
  ombi:
    image: lscr.io/linuxserver/ombi:latest
    container_name: ombi
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Athens
      - BASE_URL=/ombi #optional
    volumes:
      - /portainer/Files/AppData/Config/ombi:/config
    ports:
      - 3579:3579
    restart: unless-stopped
