x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/marreta.svg
  icon-light: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/marreta.svg
  icon-dark: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/marreta.svg
  urls:
    - https://github.com/xneo1/portainer_templates
  tags:
    - name: news
      color: gray

services:
  marreta:
    container_name: marreta
    image: ghcr.io/manualdousuario/marreta:latest
    ports:
      - "1180:80"
    environment:
      - SITE_NAME=
      - SITE_DESCRIPTION=
      - SITE_URL=
      - LANGUAGE=
