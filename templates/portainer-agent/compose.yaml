x-arcane:
  icon: https://portainer-io-assets.sfo2.digitaloceanspaces.com/logos/portainer.png
  icon-light: https://portainer-io-assets.sfo2.digitaloceanspaces.com/logos/portainer.png
  icon-dark: https://portainer-io-assets.sfo2.digitaloceanspaces.com/logos/portainer.png
  urls:
    - https://github.com/portainer/templates
  tags:
    - name: portainer
      color: pink

version: '3.2'

services:
  agent:
    image: portainer/agent
    environment:
      AGENT_CLUSTER_ADDR: tasks.agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    ports:
      - target: 9001
        published: 9001
        protocol: tcp
        mode: host
    networks:
      - portainer_agent
    deploy:
      mode: global
      placement:
        constraints: [node.platform.os == linux]

networks:
  portainer_agent:
    driver: overlay
    attachable: true
