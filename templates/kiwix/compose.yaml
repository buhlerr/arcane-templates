x-arcane:
  icon: https://www.kiwix.org/wp-content/uploads/kiwix-logo-995x200-1.png
  icon-light: https://www.kiwix.org/wp-content/uploads/kiwix-logo-995x200-1.png
  icon-dark: https://www.kiwix.org/wp-content/uploads/kiwix-logo-995x200-1.png
  urls:
    - https://github.com/xneo1/portainer_templates
  tags:
    - name: offline
      color: gray

services:
  kiwix-serve:
    image: kiwix/kiwix-serve
    volumes:
      - /portainer/Files/AppData/Config/kiwixserve:/data
    ports:
      - '78080:80'
    command:
      *.zim
